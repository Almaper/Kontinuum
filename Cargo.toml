[workspace]
resolver = "3"
members = [
    "crates/knt-dsp",
    "crates/knt-engine",
    "crates/knt-player",
    "crates/knt-cli",
    "crates/knt-ui",
]

[workspace.package]
version = "0.5.1"
edition = "2024"
license = "GPL-3.0-only"
publish = false

# The DSP runs per sample: even the dev build is optimized, so that `cargo run` plays without
# dropouts and the tests that render minutes of music stay quick.
[profile.dev.package."*"]
opt-level = 2

[profile.dev]
opt-level = 1

# The profile of the packages: link-time optimization costs a long build, so
# `cargo build --release` stays as it is for everyday work.
[profile.dist]
inherits = "release"
lto = "fat"
codegen-units = 1
strip = true
