[package]
name = "knt-cli"
version.workspace = true
edition.workspace = true
license.workspace = true
publish.workspace = true
description = "knt: Kontinuum from the command line (render, play, the Carta)"

[[bin]]
name = "knt"
path = "src/main.rs"

[dependencies]
knt-engine = { path = "../knt-engine" }
knt-player = { path = "../knt-player" }
clap = { version = "4.6.7", features = ["derive"] }
flacenc = "0.5.1"
vorbis_rs = "0.5.6"
ctrlc = "3.5.2"
